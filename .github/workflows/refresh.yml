name: Refresh data and deploy

on:
  schedule:
    # GitHub runs schedules in UTC. Central time is UTC-5 in daylight time, UTC-6 from early November.
    - cron: '10 13 * * *'   # ~8:10 AM Central: last night's results and box scores, rosters, lines
    - cron: '40 20 * * *'   # ~3:40 PM Central: lines and player props for tonight
    - cron: '20 23 * * *'   # ~6:20 PM Central: late line moves and props before the later games
  workflow_dispatch:
    inputs:
      props:
        description: 'Also pull player prop lines (5 Odds API credits per game)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['web/**', 'model/**', 'scripts/**', 'pipeline/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Refresh data
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PROPS: ${{ (github.event_name == 'workflow_dispatch' && inputs.props) || (github.event_name == 'schedule' && github.event.schedule != '10 13 * * *') }}
        run: node pipeline/refresh.js

      - name: Check for roster changes
        id: heads
        if: github.event_name != 'push'
        run: |
          if [ -s data/heads-needed.json ] && [ "$(tr -d '[:space:]' < data/heads-needed.json)" != "[]" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.heads.outputs.needed == 'true'
        with:
          python-version: '3.12'
      - name: Rebuild headshot sheets for changed rosters
        if: steps.heads.outputs.needed == 'true'
        continue-on-error: true # a photo problem should never hold up the data
        run: |
          python -m pip install --quiet pillow
          python pipeline/headshots.py

      - name: Test
        run: node --test tests/*.test.js

      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name "blueline-bot"
          git config user.email "blueline-bot@users.noreply.github.com"
          git add data web/p
          if ! git diff --cached --quiet; then
            git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: node scripts/build-site.js

      - name: Check that GitHub Pages is turned on
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$src" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            msg="The data is saved, but the site was not published: GitHub Pages is not set to deploy from GitHub Actions yet. Go to Settings > Pages > Build and deployment > Source and pick GitHub Actions, then run this workflow again."
            echo "::warning::$msg"
            printf '\n### Site not published\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
      - id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5

      - name: Site link
        if: steps.deploy.outputs.page_url != ''
        run: printf '\n### Your site\n\n%s\n' "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
